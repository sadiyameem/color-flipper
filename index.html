<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color Flipper</title>
  </head>
  <body>
    <div class="container">
      <p id="color-code">Color name:</p>
      <h1>Color-Flipper</h1>
      <input type="text" id="color-input" placeholder="Enter color here">
      <div class="btn-container">
        <div class="btn" id="generate-color">Generate Color</div>
        <div class="btn" id="random-color">Random Color</div>
        <div class="btn" id="copy-color">Copy Color</div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
