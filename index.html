<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Flipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Color Flipper</h1>

    <div class="boxes">
      <div class="box-wrapper">
        <div class="color-box" id="gradientBox">
          <p id="gradientCode">#ffffff, #ffffff</p>
        </div>

        <div class="button-group">
          <button id="gradientButton">Gradient Colors</button>
          <button id="darkModeButton">Dark Mode</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
